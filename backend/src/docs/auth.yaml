paths:
  /api/auth/registro:
    post:
      summary: Registrar usuario
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nombre, password]
              properties:
                email:    { type: string, example: juan@mail.com }
                nombre:   { type: string, example: Juan }
                password: { type: string, example: miPassword123 }
      responses:
        '201':
          description: Usuario creado + token JWT

  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, example: juan@mail.com }
                password: { type: string, example: miPassword123 }
      responses:
        '200':
          description: Token JWT
        '401':
          description: Credenciales incorrectas

  /api/auth/me:
    get:
      summary: Datos del usuario autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario
        '401':
          description: Token requerido
